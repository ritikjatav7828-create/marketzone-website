<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2Z Coaching | Karera's Best</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #002347; /* Royal Navy */
            --gold: #d4af37;    /* Classic Gold */
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: #f8f9fa; color: #333; }

        /* --- Header --- */
        header {
            background: var(--primary);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0; z-index: 1000;
            border-bottom: 3px solid var(--gold);
        }
        .logo { color: var(--gold); font-size: 1.8rem; font-weight: 800; text-decoration: none; }
        nav a { color: var(--white); text-decoration: none; margin-left: 20px; font-weight: 500; transition: 0.3s; }
        nav a:hover { color: var(--gold); }

        /* --- Hero Section --- */
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(0, 35, 71, 0.8), rgba(0, 35, 71, 0.8)), url('https://images.unsplash.com/photo-1523050853021-eb611305961e?auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: var(--white); padding: 0 20px;
        }
        .hero h1 { font-size: 3.5rem; margin-bottom: 15px; }
        .hero span { color: var(--gold); }
        .hero p { font-size: 1.2rem; margin-bottom: 30px; max-width: 800px; }

        /* --- Subjects Section --- */
        .subjects { padding: 80px 5%; text-align: center; background: #fff; }
        .section-title { font-size: 2.5rem; margin-bottom: 50px; color: var(--primary); font-weight: 800; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-bottom: 5px solid var(--gold);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-10px); background: var(--primary); color: white; }
        .card i { font-size: 3rem; color: var(--gold); margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; }

        .notes-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: var(--gold);
            color: var(--primary);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: 0.3s;
        }
        .card:hover .notes-btn { background: white; color: var(--primary); }

        /* --- Stats Bar --- */
        .stats { background: var(--primary); color: var(--gold); padding: 50px 10%; display: flex; justify-content: space-around; flex-wrap: wrap; text-align: center; gap: 30px; }
        .stat-item h2 { font-size: 2.5rem; color: white; }

        /* --- Contact --- */
        .cta { padding: 100px 10%; text-align: center; background: #f4f7f6; }
        .btn-call { 
            background: #27ae60; color: white; padding: 15px 40px; 
            border-radius: 50px; text-decoration: none; font-weight: 700; 
            display: inline-block; margin: 10px; font-size: 1.1rem;
        }
        .btn-wa { background: var(--gold); color: var(--primary); }

        footer { background: var(--primary); color: #888; padding: 40px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            nav { display: none; }
        }
    </style>
</head>
